[pytest]
pythonpath = .
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
env =
    TESTING=1
    DATABASE_URL=sqlite:///:memory:
    SOCRATA_APP_TOKEN=fake_token_for_tests
